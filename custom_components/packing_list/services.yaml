create_list:
  fields:
    name:
      required: true
      example: "Skiferie 2027"
      selector:
        text:
    trip_date:
      selector:
        date:
    templates:
      example: "Vandretur"
      selector:
        text:
          multiple: true
    tags:
      example: "ski, fly"
      selector:
        text:
          multiple: true
    categories:
      example: "Tøj"
      selector:
        text:
          multiple: true
    items:
      example: "Pas"
      selector:
        text:
          multiple: true
    include_always:
      default: true
      selector:
        boolean:

