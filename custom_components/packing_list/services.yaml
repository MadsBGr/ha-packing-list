create_list:
  fields:
    name:
      required: true
      example: "Skiferie 2027"
      selector:
        text:
    tags:
      example: "ski, fly"
      selector:
        text:
          multiple: true
    categories:
      example: "Tøj"
      selector:
        text:
          multiple: true
    items:
      example: "Pas"
      selector:
        text:
          multiple: true
    include_always:
      selector:
        boolean:
    use_weight:
      selector:
        boolean:
